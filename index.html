<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no"
  >

  <title>Frog Find Home</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    #unity-logo {
      width: 154px;
      height: 130px;
      background: url('TemplateData/unity-logo-dark.png') no-repeat center;
    }

    #unity-progress-bar-empty {
      width: 141px;
      height: 18px;
      margin-top: 10px;
      background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 18px;
      background: url('TemplateData/progress-bar-full-dark.png') no-repeat center;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 5%;
      transform: translateX(-50%);
      z-index: 20;
    }
  </style>
</head>

<body>

<div id="unity-container">
  <canvas id="unity-canvas"></canvas>

  <div id="unity-loading-bar">
    <div id="unity-logo"></div>

    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>

  <div id="unity-warning"></div>
</div>

<script>
  const container = document.querySelector("#unity-container");
  const canvas = document.querySelector("#unity-canvas");
  const loadingBar = document.querySelector("#unity-loading-bar");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    function updateBannerVisibility() {
      warningBanner.style.display =
        warningBanner.children.length ? "block" : "none";
    }

    const div = document.createElement("div");
    div.innerHTML = msg;

    warningBanner.appendChild(div);

    if (type === "error") {
      div.style = "background:red;padding:10px;color:white;";
    } else {
      if (type === "warning") {
        div.style = "background:yellow;padding:10px;";
      }

      setTimeout(function () {
        warningBanner.removeChild(div);
        updateBannerVisibility();
      }, 5000);
    }

    updateBannerVisibility();
  }

  const buildUrl = "Build";
  const loaderUrl = buildUrl + "/Frog Find Home.loader.js";

  const config = {
    dataUrl: buildUrl + "/Frog Find Home.data",
    frameworkUrl: buildUrl + "/Frog Find Home.framework.js",
    codeUrl: buildUrl + "/Frog Find Home.wasm",

    streamingAssetsUrl: "StreamingAssets",

    companyName: "BNA",
    productName: "Frog Find Home",
    productVersion: "1.0",

    showBanner: unityShowBanner
  };

  canvas.style.background =
    "url('" + buildUrl + "/Frog Find Home.jpg') center / cover";

  loadingBar.style.display = "block";

  const script = document.createElement("script");
  script.src = loaderUrl;

  script.onload = () => {

    createUnityInstance(
      canvas,
      config,
      (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      }
    )
    .then((unityInstance) => {

      loadingBar.style.display = "none";

    })
    .catch((message) => {

      alert(message);

    });
  };

  document.body.appendChild(script);
</script>

</body>
</html>
